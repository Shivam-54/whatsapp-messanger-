<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Message Sender</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0f0d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #111a15;
      border: 1px solid #1e3028;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #25d366;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 600;
      color: #e8f5ee;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #e8f5ee;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #4a7a5e;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #4a7a5e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      background: #0d1510;
      border: 1px solid #1e3028;
      border-radius: 10px;
      color: #e8f5ee;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 12px 14px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #25d366;
    }

    input::placeholder, textarea::placeholder {
      color: #2a4a36;
    }

    select option {
      background: #111a15;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .media-url-field {
      display: none;
    }

    .media-url-field.visible {
      display: block;
    }

    .hint {
      font-size: 12px;
      color: #2e5c40;
      margin-top: 6px;
      font-family: 'DM Mono', monospace;
    }

    .send-btn {
      width: 100%;
      background: #25d366;
      color: #0a0f0d;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .send-btn:hover { background: #20c45a; }
    .send-btn:active { transform: scale(0.98); }
    .send-btn:disabled { background: #1a3d28; color: #2e5c40; cursor: not-allowed; }

    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      display: block;
      background: #0d2a1a;
      border: 1px solid #1e4a2e;
      color: #25d366;
    }

    .status.error {
      display: block;
      background: #2a0d0d;
      border: 1px solid #4a1e1e;
      color: #e05a5a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
        </svg>
      </div>
      <span class="logo-text">WA Sender</span>
    </div>

    <h1>Send a message</h1>
    <p class="subtitle">Fill the form — message lands on WhatsApp.</p>

    <div class="field">
      <label>WhatsApp number</label>
      <input type="tel" id="phone" placeholder="919876543210 (with country code, no +)" />
      <p class="hint">India → 91xxxxxxxxxx</p>
    </div>

    <div class="field">
      <label>Message type</label>
      <select id="type" onchange="handleTypeChange()">
        <option value="text">Text</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="audio">Audio</option>
        <option value="document">Document</option>
      </select>
    </div>

    <div class="field">
      <label>Message</label>
      <textarea id="message" placeholder="Type your message here..."></textarea>
    </div>

    <div class="field media-url-field" id="mediaUrlField">
      <label>Media URL</label>
      <input type="url" id="mediaUrl" placeholder="https://example.com/file.mp4" />
      <p class="hint">Must be a publicly accessible URL</p>
    </div>

    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      Send message
    </button>

    <div class="status" id="status"></div>
  </div>

  <script>
    // !! REPLACE THIS WITH YOUR N8N WEBHOOK URL !!
    const N8N_WEBHOOK_URL = 'YOUR_N8N_WEBHOOK_URL_HERE';

    function handleTypeChange() {
      const type = document.getElementById('type').value;
      const mediaField = document.getElementById('mediaUrlField');
      const messageField = document.getElementById('message');

      if (type === 'text') {
        mediaField.classList.remove('visible');
        messageField.placeholder = 'Type your message here...';
      } else {
        mediaField.classList.add('visible');
        messageField.placeholder = 'Optional caption for the media...';
      }
    }

    async function sendMessage() {
      const phone = document.getElementById('phone').value.trim();
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value.trim();
      const mediaUrl = document.getElementById('mediaUrl').value.trim();
      const btn = document.getElementById('sendBtn');
      const status = document.getElementById('status');

      if (!phone) return showStatus('Please enter a phone number.', 'error');
      if (type === 'text' && !message) return showStatus('Please enter a message.', 'error');
      if (type !== 'text' && !mediaUrl) return showStatus('Please enter a media URL.', 'error');

      btn.disabled = true;
      btn.textContent = 'Sending...';
      status.style.display = 'none';

      const payload = { phone, type, message };
      if (type !== 'text') payload.mediaUrl = mediaUrl;

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          showStatus('Message sent successfully!', 'success');
          document.getElementById('message').value = '';
          document.getElementById('mediaUrl').value = '';
        } else {
          showStatus('Failed to send. Check your n8n webhook.', 'error');
        }
      } catch (err) {
        showStatus('Network error. Is n8n running?', 'error');
      }

      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send message`;
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }
  </script>
</body>
</html>
